<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <title>Mon profil — ATHAR</title>
  <meta name="description" content="Votre espace ATHAR : connexion, commandes et suivi de chaque produit.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Cairo:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="profil">
  <div id="site-header"></div>

  <main id="main">
    <section class="section">
      <div class="container" style="max-width:960px">
        <div class="section-head">
          <span class="eyebrow" data-i18n="ac.eyebrow">Mon espace</span>
          <h1 style="font-size:clamp(2rem,4vw,3rem)" data-i18n="ac.h1">Mon profil</h1>
        </div>

        <p class="notice mb-2">Connectez-vous pour retrouver vos commandes et suivre l'état de chaque produit. Les rôles de démonstration plus bas ne sont pas liés à votre compte.</p>

        <!-- COMPTE : connexion / inscription -->
        <div id="auth-guest" class="hidden">
          <div class="form-card mb-2">
            <h2 style="font-size:1.5rem">Connexion</h2>
            <form id="login-form" novalidate>
              <div class="form-row"><label for="l-email">Email</label><input id="l-email" type="email" autocomplete="email"></div>
              <div class="form-row"><label for="l-pass">Mot de passe</label><input id="l-pass" type="password" autocomplete="current-password"></div>
              <p id="login-error" class="field-error"></p>
              <button class="btn btn--primary" type="submit">Se connecter</button>
            </form>
          </div>

          <div class="form-card mb-2">
