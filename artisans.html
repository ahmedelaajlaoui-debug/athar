<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <title>Artisans — ATHAR</title>
  <meta name="description" content="Annuaire des artisans et coopératives du Sahara marocain.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Cairo:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="artisans">
  <div id="site-header"></div>

  <main id="main">
    <section class="hero hero--small" data-bg="workshop">
      <div class="container">
        <div class="hero__inner">
          <span class="eyebrow" style="color:#f0c9a0">Derrière chaque objet, une personne</span>
          <h1>Derrière chaque création, une histoire.</h1>
          <p>Rencontrez les femmes et les hommes qui font vivre le patrimoine hassani.</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <p class="notice mb-2">Les profils d'artisans présentés ici sont des exemples fictifs créés pour la démonstration.</p>

        <!-- Detail view (opens when a profile is selected) -->
        <article class="artisan-detail" id="artisan-detail" aria-live="polite"></article>

        <!-- Filters -->
        <form class="form-card mb-2" id="artisan-filters" role="search" onsubmit="return false">
          <div class="form-grid" style="grid-template-columns:2fr 1fr 1fr">
            <div>
              <label for="artisan-search">Rechercher un artisan ou une coopérative</label>
              <input id="artisan-search" type="search" placeholder="Ex. : Fatima, Coopérative Al Amal…">
            </div>
            <div>
              <label for="artisan-city">Ville</label>
              <select id="artisan-city"><option value="">Toutes les villes</option></select>
            </div>
            <div>
              <label for="artisan-craft">Métier</label>
              <select id="artisan-craft"><option value="">Tous les métiers</option></select>
            </div>
          </div>
          <label class="check mt-1"><input type="checkbox" id="artisan-verified"> Coopératives vérifiées uniquement</label>
        </form>

        <p class="muted" id="artisan-count"></p>
        <div class="grid grid--4" id="artisan-grid"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/coop-data.js"></script>
  <script src="js/account.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/artisans.js"></script>
</body>
</html>
